<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#12102a"/>
  <!-- Binary Tree: root -->
  <circle cx="16" cy="6" r="3.5" fill="#4285F4"/>
  <!-- Lines from root to children -->
  <line x1="13.5" y1="8.5"  x2="9"  y2="17.5" stroke="#4285F4" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="18.5" y1="8.5"  x2="23" y2="17.5" stroke="#34A853" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- Left child -->
  <circle cx="8"  cy="20" r="3" fill="#7c6cf0"/>
  <!-- Right child -->
  <circle cx="24" cy="20" r="3" fill="#34A853"/>
  <!-- Lines from left child to its children -->
  <line x1="6.2"  y1="22.5" x2="4.5" y2="27" stroke="#7c6cf0" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="9.8"  y1="22.5" x2="11.5" y2="27" stroke="#7c6cf0" stroke-width="1.4" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Leaf nodes -->
  <circle cx="4"  cy="28.5" r="2" fill="#FBBC04"/>
  <circle cx="12" cy="28.5" r="2" fill="#FBBC04"/>
</svg>
