<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#091a0f"/>

  <!-- CLIENT box (top) -->
  <rect x="10" y="2" width="12" height="7" rx="2" fill="#4285F4" opacity="0.9"/>
  <line x1="12" y1="4.5" x2="20" y2="4.5" stroke="white" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="12" y1="6.5" x2="17" y2="6.5" stroke="white" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Arrow down to SERVER -->
  <line x1="16" y1="9" x2="16" y2="13" stroke="white" stroke-width="1.4" stroke-opacity="0.45" stroke-linecap="round"/>
  <polygon points="16,14 14.5,11.5 17.5,11.5" fill="white" opacity="0.45"/>

  <!-- SERVER box (middle) -->
  <rect x="8" y="14" width="16" height="7" rx="2" fill="#7c6cf0" opacity="0.9"/>
  <circle cx="12" cy="17.5" r="1.5" fill="white" opacity="0.6"/>
  <line x1="15" y1="16" x2="21" y2="16" stroke="white" stroke-width="1" stroke-opacity="0.7"/>
  <line x1="15" y1="18.5" x2="21" y2="18.5" stroke="white" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Arrow down to DB -->
  <line x1="16" y1="21" x2="16" y2="25" stroke="white" stroke-width="1.4" stroke-opacity="0.45" stroke-linecap="round"/>
  <polygon points="16,26 14.5,23.5 17.5,23.5" fill="white" opacity="0.45"/>

  <!-- DATABASE cylinder (bottom) -->
  <ellipse cx="16" cy="27" rx="7" ry="2.2" fill="#34A853" opacity="0.9"/>
  <rect x="9" y="25" width="14" height="3.5" fill="#34A853" opacity="0.9"/>
  <ellipse cx="16" cy="25" rx="7" ry="2.2" fill="#2d9e47"/>
</svg>
